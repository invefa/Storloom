<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Storloom</title><link rel="stylesheet" href="reader.css"><script defer src="archive-index.js"></script><script defer src="reader.js"></script></head>
<body><aside><header><strong id="archive-title"></strong><div class="appearance"><select id="palette"></select><button id="theme"></button></div></header><input id="contacts-search" type="search"><nav id="conversations"></nav></aside>
<main><header class="chat-header"><div><h1 id="chat-title"></h1><small id="chat-meta"></small></div><input id="message-search" type="search"><details id="filter-panel"><summary id="filter-label"></summary><div class="filters"><label><span id="kind-label"></span><select id="kind-filter"></select></label><label><span id="sender-label"></span><input id="sender-filter" type="search"></label><label><span id="from-label"></span><input id="date-from" type="date"></label><label><span id="to-label"></span><input id="date-to" type="date"></label><label><input id="self-filter" type="checkbox"><span id="self-label"></span></label><button id="reset-filter"></button><button id="find-page"></button><button id="stop-search" hidden></button><span id="filter-status" role="status"></span></div></details></header><div id="notice" role="status"></div><section id="messages" aria-live="polite"></section><footer><button id="first"></button><button id="previous"></button><span id="page"></span><button id="next"></button><button id="last"></button><label id="jump-label" for="page-input"></label><input id="page-input" type="number" min="1" step="1"><button id="page-go"></button></footer></main><dialog id="image-preview"><header><button id="image-previous"></button><span id="image-title"></span><button id="image-next"></button><button id="image-close"></button></header><div id="image-stage"><img id="preview-image" alt=""></div><footer><button id="zoom-out">-</button><button id="zoom-fit"></button><button id="zoom-original">100%</button><button id="zoom-in">+</button><span id="zoom-value"></span><button id="image-save"></button></footer></dialog><div id="reader-menu" role="menu" hidden></div><div id="action-status" role="status" aria-live="polite"></div></body></html>
