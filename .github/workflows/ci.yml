name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/Audit-Public.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Storloom.sln -c Release --nologo
      - run: dotnet test Storloom.sln -c Release --no-build --nologo --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
