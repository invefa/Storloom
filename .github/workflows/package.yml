name: Package Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: '2.16.0'
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/Audit-Public.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Storloom.sln -c Release --nologo
      - name: Build package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          ./scripts/Publish.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: |
            artifacts/releases/**/*.zip
            artifacts/releases/**/*.sha256
      - name: Publish stable release for in-app updates
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --title "Storloom $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          $assets = @(Get-ChildItem artifacts/releases -Recurse -File | Where-Object { $_.Name -match '\.zip(?:\.sha256)?$' } | ForEach-Object FullName)
          if ($assets.Count -ne 2) { throw 'Expected one Windows package and its checksum.' }
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
