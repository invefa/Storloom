name: Package Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: '0.6.0'
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/Audit-Public.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Storloom.sln -c Release --nologo
      - name: Build package
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          ./scripts/Publish.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: |
            artifacts/releases/**/*.zip
            artifacts/releases/**/*.sha256
